<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Calendar reminder with checkmark</title>
  <desc id="desc" fill="#0b7a6d">Purple gradient app icon with a white calendar and green confirmation badge.</desc>
  <defs fill="#0b7a6d">
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" fill="#0b7a6d">
      <stop offset="0" stop-color="#19c2b3" fill="#0b7a6d"/>
      <stop offset="1" stop-color="#063b34" fill="#0b7a6d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1" fill="#0b7a6d">
      <stop offset="0" stop-color="#FFFFFF" fill="#0b7a6d"/>
      <stop offset="1" stop-color="#E9EFFF" fill="#0b7a6d"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1" fill="#0b7a6d">
      <stop offset="0" stop-color="#74ff74" fill="#0b7a6d"/>
      <stop offset="1" stop-color="#057005" fill="#0b7a6d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" fill="#0b7a6d">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" fill="#0b7a6d"/>
      <feOffset dy="12" fill="#0b7a6d"/>
      <feComponentTransfer fill="#0b7a6d"><feFuncA type="linear" slope="0.20" fill="#0b7a6d"/></feComponentTransfer>
      <feMerge fill="#0b7a6d"><feMergeNode fill="#0b7a6d"/><feMergeNode in="SourceGraphic" fill="#0b7a6d"/></feMerge>
    </filter>
    <filter id="badgeShadow" x="-40%" y="-40%" width="180%" height="180%" fill="#0b7a6d">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" fill="#0b7a6d"/>
      <feOffset dy="6" fill="#0b7a6d"/>
      <feComponentTransfer fill="#0b7a6d"><feFuncA type="linear" slope="0.22" fill="#0b7a6d"/></feComponentTransfer>
      <feMerge fill="#0b7a6d"><feMergeNode fill="#0b7a6d"/><feMergeNode in="SourceGraphic" fill="#0b7a6d"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="72" y="72" width="880" height="880" rx="190" fill="url(#bg)"/>

  <!-- Calendar body -->
  <g filter="url(#shadow)">
    <rect x="222" y="278" width="580" height="470" rx="54" fill="url(#paper)"/>
    <path d="M222 332a54 54 0 0 1 54-54h472a54 54 0 0 1 54 54v78H222z" fill="#FFFFFF"/>
  </g>

  <!-- Calendar binding rings -->
  <g filter="url(#shadow)">
    <rect x="330" y="180" width="58" height="166" rx="29" fill="#FFFFFF"/>
    <rect x="636" y="180" width="58" height="166" rx="29" fill="#FFFFFF"/>
  </g>

  <!-- Calendar date marks -->
  <g fill="#5425F2">
    <rect x="330" y="462" width="78" height="78" rx="17" fill="#0b7a6d"/>
    <rect x="485" y="462" width="78" height="78" rx="17" fill="#0b7a6d"/>
    <rect x="330" y="590" width="78" height="78" rx="17" fill="#0b7a6d"/>
    <rect x="485" y="590" width="78" height="78" rx="17" fill="#0b7a6d"/>
  </g>

  <!-- Completion badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="746" cy="680" r="128" fill="url(#green)"/>
    <path d="M688 680l39 40 81-88" fill="none" stroke="#FFFFFF" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>